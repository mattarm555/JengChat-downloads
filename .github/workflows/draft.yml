name: Build friends draft
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Reviewed JengChat source tag, for example v2.1.0-beta.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    environment: friends-release
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mattarm555/JengChat
          ssh-key: ${{ secrets.JENGCHAT_SOURCE_READ_KEY }}
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed source tag
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "RELEASE_DIR=dist/$version/releases" >> $env:GITHUB_ENV
          if ($env:SOURCE_TAG -ne ('v'+$version)) { throw 'Tag does not match VERSION' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw 'Release source must be merged into main' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.7'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          release: false
          update: true
      - name: Restore checksum-pinned UCRT64 dependencies
        shell: pwsh
        run: python tools/restore_windows_toolchain.py
      - name: Verify engines, game rendering, and delivery behavior
        shell: pwsh
        run: |
          ./tools/setup_ci_rendering.ps1
          ./tools/verify_release.ps1
      - name: Build verified installer
        shell: pwsh
        run: python tools/build_release.py
      - name: Exercise native update downloads and failure recovery
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "RELEASE_DIR=dist/$version/releases" >> $env:GITHUB_ENV
          python tests/verify_updates.py --releases "dist/$version/releases"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: friends-release
          path: ${{ env.RELEASE_DIR }}/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    environment: friends-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name friends-release --dir release
      - name: Create draft prerelease (never publish here)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 -c "import json,pathlib; m=json.loads(pathlib.Path('release/release-metadata.json').read_text()); pathlib.Path('notes.md').write_text(m['notes'])"
          gh release create "$SOURCE_TAG" release/* --draft --prerelease --title "JengChat $SOURCE_TAG — Friends Testing" --notes-file notes.md
